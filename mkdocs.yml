site_name: RelWatch
site_description: Poll GitHub, GitLab, and Gitea projects — and container images — for new releases.
site_url: https://epiclabs-cc.github.io/relwatch/
docs_dir: docs
site_dir: site
use_directory_urls: false
exclude_docs: |
  requirements.txt
copyright: RelWatch

theme:
  name: material
  language: en
  logo: assets/logo-light.jpg
  favicon: assets/logo-dark.jpg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

nav:
  - Home: https://github.com/epiclabs-cc/relwatch
  - Introduction: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - Notifications: notifications.md
  - Providers: providers.md
  - HTTP API: api.md
  - Web dashboard: web.md
  - Deployment: deployment.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
